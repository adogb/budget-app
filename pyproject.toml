[project]
name = "budget-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[tool.ruff]
exclude = ["alembic/versions/*"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez
    "BLE",  # flake8-blind-except
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]

[tool.pyright]
# Same checker as Pylance in VS Code, so the editor and `uv run pyright` agree.
include = ["app", "tests", "scripts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
