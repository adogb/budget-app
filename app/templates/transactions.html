{% extends "base.html" %}

{% block title %}Transactions - Budget App{% endblock %}

{% block head %}
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-3xl font-semibold text-gray-900">Transactions</h1>
        <p class="text-gray-600 mt-1">View and manage your transactions</p>
    </div>

    <!-- Filters and Sync Button -->
    <div class="mb-6 flex gap-4 items-center">
        <select class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All Accounts</option>
            {% for account in accounts %}
            <option value="{{ account.id }}" {% if selected_account_id == account.id %}selected{% endif %}>
                {{ account.name }}
            </option>
            {% endfor %}
        </select>

        <!-- Sync Button -->
        <button
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            hx-post="/accounts/sync"
            hx-target="#transactions-wrapper"
            hx-swap="innerHTML"
            hx-indicator="#sync-spinner"
            title="Syncing may take 30-60 seconds for large transaction histories">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Sync Accounts
        </button>

        <!-- Loading Spinner -->
        <div id="sync-spinner" class="htmx-indicator flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-sm text-gray-600">Syncing...</span>
        </div>

        <!-- Sync Status -->
        <div id="sync-status" class="ml-auto">
            <!-- Status will be updated via HTMX -->
        </div>
    </div>

    <!-- Transactions Table -->
    <div id="transactions-wrapper">
        {% include "transactions/_transaction_table.html" %}
    </div>
</div>
{% endblock %}
