<li class="px-4 py-3 hover:bg-indigo-700 cursor-pointer transition">
    <div class="flex flex-col">
        <span class="text-sm font-medium text-white mb-1">{{ account.name }}</span>
        <span class="text-xs text-indigo-300 mb-2">
            {% if account.iban %}{{ account.iban[-10:] }}{% endif %}
        </span>
        <span class="text-sm font-semibold">
            <span class="{% if account.balance >= 0 %}text-green-400{% else %}text-red-400{% endif %}">
                {{ "{:,.2f}".format(account.balance) }}
            </span>
            <span class="text-indigo-200"> {{ account.currency }}</span>
        </span>
    </div>
</li>
