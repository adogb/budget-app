{% extends "setup/setup_base.html" %}

{% block title %}Select Your Bank - Setup{% endblock %}

{% block content %}
<!-- Bank Selection Step -->
<div id="setup-step-content" class="space-y-6" data-step="institutions" data-step-label="Step 2 of 4" data-progress="50">
    <div class="flex items-center space-x-2 text-sm">
        <span class="text-indigo-600 font-medium">Step 2: Select Your Bank</span>
    </div>
    
    <h3 class="text-xl font-medium">Choose your bank</h3>
    <p class="text-gray-600">Select your bank from the list below to connect your accounts.</p>
    
    <div class="mt-4">
        <div class="relative">
            <input type="text" id="bank-search" placeholder="Search banks..." 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </div>
    
    <div class="mt-4 max-h-80 overflow-y-auto pr-2">
        <div id="banks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for bank in institutions %}
            <form method="POST" action="/setup/start-bank-link/{{ bank.id }}?country_code={{ country_code }}" class="bank-item">
                <button type="submit" class="w-full border rounded-lg p-4 hover:bg-gray-50 transition text-left">
                    <div class="flex items-center">
                        {% if bank.logo %}
                        <img src="{{ bank.logo }}" alt="{{ bank.name }}" class="w-12 h-12 object-contain mr-4">
                        {% else %}
                        <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center mr-4">
                            <span class="text-gray-500 text-xl">🏦</span>
                        </div>
                        {% endif %}
                        <span class="font-medium">{{ bank.name }}</span>
                    </div>
                </button>
            </form>
            {% endfor %}
        </div>
    </div>
    
    <div class="flex justify-between mt-8">
        <a href="/setup/countries" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            Back
        </a>
    </div>
</div>
{% endblock %}
