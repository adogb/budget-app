<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Budget App - Setup{% endblock %}</title>
    <!-- Tailwind CSS via CDN for simplicity in MVP -->
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white shadow-md h-14 flex-shrink-0">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">Budget App</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="/" class="hover:underline">Home</a></li>
                    <li><a href="/setup" class="hover:underline">Setup</a></li>
                    <li><a href="/accounts" class="hover:underline">Accounts</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 bg-gray-50 overflow-y-auto">
        <div class="max-w-3xl mx-auto py-8">
            <h1 class="text-2xl font-bold mb-6">Setup Your Bank Connection</h1>
            
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <!-- Setup Progress Bar -->
                <div class="bg-gray-100 px-6 py-4 border-b">
                    <div class="flex items-center justify-between">
                        <h2 class="font-semibold text-lg">Bank Connection Setup</h2>
                        <div id="setup-progress" class="flex items-center space-x-2 text-sm">
                            <span id="step-status" class="text-indigo-600 font-medium">Getting started...</span>
                        </div>
                    </div>
                    
                    <!-- Step Indicator -->
                    <div class="mt-3 w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Step Content -->
                <div class="p-6">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </main>

    {% block scripts %}{% endblock %}
    <!-- Custom app scripts -->
    <script src="/static/js/setup.js"></script>
</body>
</html>
