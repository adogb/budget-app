<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Authentication Complete - Budget App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md mx-auto p-8 bg-white rounded-lg shadow-md text-center">
        <svg class="w-20 h-20 text-green-500 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Authentication Complete!</h1>
        
        <p class="text-gray-600 mb-6">
            You have successfully authenticated with your bank. 
            You can now <strong>close this tab</strong> and return to the setup page.
        </p>
        
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
            <p class="text-blue-700 text-sm">
                The setup page will automatically detect your connected accounts.
            </p>
        </div>
        
        <button onclick="window.close()" class="mt-6 bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
            Close This Tab
        </button>
    </div>
</body>
</html>
