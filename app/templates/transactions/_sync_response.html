<!-- Primary swap content: full transaction table (swapped into #transactions-wrapper) -->
{% include "transactions/_transaction_table.html" %}

<!-- OOB swap for accounts list -->
<ul id="accounts-list" hx-swap-oob="innerHTML">
    {% for account in accounts %}
        {% include "accounts/_account_item.html" %}
    {% endfor %}
</ul>

<!-- OOB swap for sync status -->
<div id="sync-status" hx-swap-oob="innerHTML">
    <span class="{{ sync_status_class }} text-sm font-medium">{{ sync_message }}</span>
    <span class="text-gray-500 text-xs ml-2">Last synced: {{ last_synced.strftime('%H:%M:%S') }}</span>
</div>
