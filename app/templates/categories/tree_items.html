<!-- Category Tree Items -->
{% for category in tree %}
<li id="category-tree-{{ category.id }}" class="tree-item">
    <div class="flex items-center space-x-2 p-2 rounded-md hover:bg-gray-50">
        <div class="w-4 h-4 rounded-full" style="background-color: {{ category.color or '#CCCCCC' }}"></div>
        <span class="font-medium">{{ category.name }}</span>
        <div class="ml-auto flex space-x-1">
            <button class="text-gray-500 hover:text-indigo-600 edit-category" data-id="{{ category.id }}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                </svg>
            </button>
            <button class="text-gray-500 hover:text-red-600 delete-category" data-id="{{ category.id }}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>
    
    {% if category.children %}
    <ul class="pl-6 mt-1 space-y-1 border-l border-gray-200">
        {% with tree=category.children %}
            {% include "categories/tree_items.html" %}
        {% endwith %}
    </ul>
    {% endif %}
</li>
{% endfor %}
